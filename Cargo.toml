[workspace]
resolver = "2"
members = ["crates/pcbooster-core", "crates/pcbooster-app"]

[workspace.package]
version = "2.4.0"
edition = "2021"
rust-version = "1.82"
authors = ["PC-Booster contributors"]
license = "MIT"
repository = "https://github.com/MaxxAlan/PC-Booster"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
